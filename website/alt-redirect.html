<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="0;url=https://pweevee.skytweak.dpdns.org/">
<meta name="robots" content="noindex,follow">
<link rel="canonical" href="https://pweevee.skytweak.dpdns.org/">
<title>PwEevee — redirecting…</title>

<body>
<!-- A stub for the alternate host path, so there is only one indexed site.
     The real redirect belongs in the server config (see nginx.conf.example,
     which 301s this path); this file is the fallback for a static host that
     cannot issue one.

     No inline script here on purpose: the site ships a strict
     Content-Security-Policy with script-src 'self', so an inline
     location.replace() would be blocked and never run. The meta refresh needs
     no JavaScript, and the link below covers anything that ignores it. -->
<h1>PwEevee has moved to one address</h1>
<p>Redirecting to the canonical site:
  <a href="https://pweevee.skytweak.dpdns.org/">pweevee.skytweak.dpdns.org</a></p>
</body>
